[project]
name = "duplicacy-scripts"
version = "0.1.0"
description = "Python scripts for driving the Duplicacy CLI"
readme = "README.md"
authors = [
    { name = "Christopher Ng", email = "facboy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.11.6",
    "python-dotenv>=1.2.3",
]

[project.scripts]
duplicacy-py = "duplicacy_scripts.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
